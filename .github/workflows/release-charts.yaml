name: Release Charts (Chart.yaml only)

on:
  push:
    branches: [ main ]
    paths:
      - 'charts/**/Chart.yaml'
  pull_request:
    types: [closed]
    branches: [ main ]
    paths:
      - 'charts/**/Chart.yaml'

permissions:
  contents: write
  packages: write

jobs:
  release:
    # Выполняем только если:
    # - обычный push в main
    # - или PR был действительно смёржен
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: arc-runners-helm-charts

    env:
      PAGES_BRANCH: gh-pages
      OCI_REPO: oci://ghcr.io/${{ github.repository_owner }}/helm-charts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Для PR-ивента берём merge-commit, чтобы дифф был корректный
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'main' }}

      - name: Configure Git
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Resolve diff range and list changed Chart.yaml files
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          else
            # pull_request (closed, merged)
            # базируемся на базе PR и его merge-commit
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.merge_commit_sha }}"
          fi

          echo "Base: $BASE"
          echo "Head: $HEAD"

          mapfile -t CHART_FILES < <(git diff --name-only "$BASE" "$HEAD" | grep -E '^charts/[^/]+/Chart\.yaml$' || true)

          if (( ${#CHART_FILES[@]} == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Chart.yaml changes."
            exit 0
          fi

          printf '%s\n' "${CHART_FILES[@]}" > /tmp/changed_chartyamls.txt
          # Преобразуем в список имён чартов
          awk -F/ '{print $2}' /tmp/changed_chartyamls.txt | sort -u > /tmp/changed_charts.txt

          echo "Changed Chart.yaml files:"; cat /tmp/changed_chartyamls.txt
          echo "Charts affected:"; cat /tmp/changed_charts.txt

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        if: steps.diff.outputs.changed == 'true'
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Add dependency chart repos (optional)
        if: steps.diff.outputs.changed == 'true'
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update || true

      - name: Run chart-releaser (package + update gh-pages)
        if: steps.diff.outputs.changed == 'true'
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          config: cr.yaml
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_SKIP_EXISTING: "true"

      - name: Login to GHCR (for OCI push)
        if: steps.diff.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push changed charts to GHCR (OCI)
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # chart-releaser складывает пакеты в .cr-release-packages
          CHANGED=( $(cat /tmp/changed_charts.txt) )
          if (( ${#CHANGED[@]} == 0 )); then
            echo "No charts resolved from changed Chart.yaml — nothing to push."
            exit 0
          fi

          for chart in "${CHANGED[@]}"; do
            # Ищем соответствующие пакеты по шаблону имени
            for pkg in .cr-release-packages/"${chart}"-*.tgz; do
              echo "Pushing $pkg to GHCR..."
              helm push "$pkg" "${{ env.OCI_REPO }}"
            done
          done

      - name: Nothing to release
        if: steps.diff.outputs.changed != 'true'
        run: echo "No Chart.yaml changes detected. Skipping."
