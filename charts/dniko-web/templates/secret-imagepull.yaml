{{- if .Values.imagePullSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ShortLinks.fullname" . }}-image-pull-secret
  namespace: {{ include "ShortLinks.namespace" . }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePullSecrets.dockerConfigJson | b64enc | quote }}
{{- end }}
