apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sqz-page.fullname" . }}-secret
type: Opaque
stringData:
{{- $cfg := .Values.serviceConfig | default (dict) -}}
{{- $secretKeys := .Values.secretKeys | default (list) -}}
{{- $includeEmpty := .Values.serviceConfigIncludeEmpty | default false -}}
{{- range $k, $v := $cfg }}
{{- if has $k $secretKeys }}
{{- if or $includeEmpty (not (kindIs "invalid" $v)) (ne (printf "%v" $v) "") }}
  {{ $k }}: {{ printf "%v" $v | quote }}
{{- end }}
{{- end }}
{{- end }}